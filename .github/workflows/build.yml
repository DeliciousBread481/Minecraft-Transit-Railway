name: Build 1.21.1 NeoForge  
  
on:  
  push:  
  workflow_dispatch:  
  
jobs:  
  build:  
    name: Build 1.21.1 NeoForge  
    runs-on: ubuntu-latest  
    env:  
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Validate Gradle wrapper  
        uses: gradle/actions/wrapper-validation@v4  
  
      - name: Setup JDK 26  
        uses: actions/setup-java@v4  
        with:  
          java-version: 26  
          distribution: temurin  
  
      - name: Make Gradle wrapper executable  
        run: chmod +x ./gradlew  
  
      - name: Setup files  
        run: ./gradlew setupFiles --no-daemon  
  
      - name: Set active project to 1.21.1-neoforge  
        run: ./gradlew "Set active project to 1.21.1-neoforge" --no-daemon  
  
      - name: Build  
        run: ./gradlew 1.21.1-neoforge:buildAndCollect --no-daemon  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: MTR-1.21.1-neoforge  
          path: build/release/
